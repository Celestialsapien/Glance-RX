[package]
name = "glance-native"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# MuPDF: the single-process multi-thread engine. Display lists are parsed once
# and replayed concurrently from many threads (the crate keeps a per-thread
# fz_context via thread_local). default-features=false + "base14-fonts" keeps
# the build light (no separate libcrypto / big font sets).
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.51", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
# ⚠ 绝不可改为 "abort"：所有 extern "C" 入口都靠 safe_ffi! 的 catch_unwind 兜底
#   （见 src/ffi/bindings.rs），panic 跨 FFI 边界 = UB 静默崩。
#   显式声明，防止被 workspace / 本机 profile 覆盖悄悄改掉。
panic = "unwind"

[dev-dependencies]
tempfile = "3"
